workflows:
  android-release:
    name: Cloud Authenticator - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_services   # grup di Codemagic > Environment variables, isi var GOOGLE_SERVICES_JSON (base64)
      android_signing:
        - cloud_auth        # reference name keystore yang sudah diupload di Settings > Android keystores
      vars:
        PACKAGE_NAME: "siell.claud.authenticator"
      java: 17

    scripts:
      - name: Tulis ulang google-services.json dari environment variable
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > $CM_BUILD_DIR/app/google-services.json

      - name: Suntikkan signingConfig release menggunakan kredensial Codemagic (tidak diubah di repo, hanya di mesin build)
        script: |
          cat <<EOF >> $CM_BUILD_DIR/app/build.gradle.kts

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH")!!)
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")!!
                      keyAlias = System.getenv("CM_KEY_ALIAS")!!
                      keyPassword = System.getenv("CM_KEY_PASSWORD")!!
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build Gradle Release (APK & AAB, sudah signed)
        script: |
          cd $CM_BUILD_DIR
          ./gradlew clean
          ./gradlew assembleRelease bundleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - kempesedan@gmail.com
        notify:
          success: true
          failure: true
